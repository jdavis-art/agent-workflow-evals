id: threshold-3
description: >-
  precision and recall of the shipped config at the digest threshold.
  precision floor 0.20 is the 2026-09-05 baseline (measured 0.2353 on hand-corrected labels);
  target 0.60 once the scoring config adds exclusion terms for services, program administration,
  property management, vouchers, and trades work.
inputs: {golden_csv: golden.csv, threshold: 3}
assert:
  - json_path: {path: recall, gte: 0.90}
  - json_path: {path: precision, gte: 0.20}
